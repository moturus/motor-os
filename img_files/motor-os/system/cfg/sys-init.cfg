# tty is required.
tty:/system/services/sys-tty

# strobe is optional. sys-init launches it with CAP_SYS | CAP_LOG |
# CAP_FS_WRITE; lower-role services submit records over IPC and do not write
# /system/logs directly.
strobe:/system/services/strobe

# Services (optional).
# The line must start with svc:, followed by capabilities
# (see caps.rs in moto-sys).

# Stats registry: userspace stats providers register here so collectors
# (e.g. `sysbox stats`, `free`) can discover them. CAP_LOG (8) for logging;
# it needs neither network nor filesystem-write access.
# svc:8:/system/services/sys-stats-reg

# DNS resolver: fixed-size IPC front-end over mlibc getaddrinfo().
# caps 264 = CAP_LOG(8) | CAP_NET(256). CAP_LOG is used for startup and
# malformed-request diagnostics; the resolver never modifies the filesystem.
svc:264:/system/services/dns-resolver

# caps 1020 = CAP_SPAWN(4) | CAP_LOG(8) | CAP_SHUTDOWN(16) |
# CAP_SPAWN_DETACHED(32) | CAP_INTERACTIVE(64) | CAP_VSOCK(128) |
# CAP_NET(256) | CAP_FS_WRITE(512).
# russhd needs CAP_SPAWN_DETACHED so it can pass it to the shells it execs, which
# in turn lets a program like rmux run a server that survives the ssh session;
# CAP_INTERACTIVE gives authenticated shell and in-process SFTP work user access.
# CAP_NET serves SSH itself; CAP_FS_WRITE lets SFTP write files, and both pass on
# to sessions.
svc:1020:/system/services/russhd /system/cfg/sshd.toml
