# Note: this is a test file. Its password verifier is for the test password.
# Replace it before any deployment: see `imager set --ssh-password`.
#
# One [users.NAME] table per login name. A name is 1 to 64 ASCII letters,
# digits, `_` or `-`. Login names select credentials: they are not OS users.
# An absent or empty password_hash disables password authentication. Public
# keys are in /user/cfg/ssh/authorized_keys.NAME.
#
# password_hash is the hex SHA-256 of the salt's bytes followed by the password.
# Replace this file atomically: a partly written one denies new logins.

