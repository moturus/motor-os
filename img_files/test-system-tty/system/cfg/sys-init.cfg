# This test-only image gives the serial console a System-role session.
tty:system:/system/services/sys-tty

# sys-init launches strobe with CAP_SYS | CAP_LOG.
strobe:/system/services/strobe

# CAP_SPAWN | CAP_LOG | CAP_SHUTDOWN | CAP_SPAWN_DETACHED | CAP_INTERACTIVE.
svc:124:/system/services/russhd /system/cfg/sshd.toml
