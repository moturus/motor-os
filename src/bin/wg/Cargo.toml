[package]
name = "wg"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
native-tests = ["moto-sdk/test-support"]

[[bin]]
name = "wg-tool"
path = "src/tool_main.rs"

[[bin]]
name = "wg-self-test"
path = "src/native_main.rs"
required-features = ["native-tests"]

[dependencies]
base64 = "0.22"
boringtun = { git = "https://github.com/moturus/boringtun.git", rev = "dcad5645547a89b278b346a399dbc0fae19a02f4" }
ipnetwork = "0.20"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "motor")'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
moto-sdk = { path = "../../sys/lib/moto-sdk" }

[dev-dependencies]
boringtun = { git = "https://github.com/moturus/boringtun.git", rev = "dcad5645547a89b278b346a399dbc0fae19a02f4", features = ["mock-instant"] }
mock_instant = "0.3"

[patch.crates-io]
ring = { git = "https://github.com/moturus/ring.git", rev = "b1dad2579de791d0c31ad33300187e584ba6c268" }
parking_lot = { git = "https://github.com/moturus/parking_lot.git", rev = "bae5531d97330ee51ce59e4cb4322f5d4e426305" }
parking_lot_core = { git = "https://github.com/moturus/parking_lot.git", rev = "bae5531d97330ee51ce59e4cb4322f5d4e426305" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
