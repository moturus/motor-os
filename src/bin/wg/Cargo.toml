[package]
name = "wg"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
base64 = "0.22"
ipnetwork = "0.20"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "motor")'.dependencies]
moto-sdk = { path = "../../sys/lib/moto-sdk" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
