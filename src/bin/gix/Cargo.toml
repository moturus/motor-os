[package]
name = "motor-gix"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gix"
path = "src/main.rs"

[[test]]
name = "native-port"
path = "tests/native_port.rs"
harness = false

[dependencies]
clap = { version = "=4.6.0", default-features = false, features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
gix = { git = "https://github.com/moturus/gitoxide.git", rev = "d3e2dd89b0ea3f30b5cf24d4d7327de944d9824c", default-features = false, features = [
    "attributes",
    "blob-diff",
    "blocking-network-client",
    "dirwalk",
    "excludes",
    "index",
    "merge",
    "revision",
    "sha1",
    "status",
    "worktree-mutation",
] }
gix-features = { git = "https://github.com/moturus/gitoxide.git", rev = "d3e2dd89b0ea3f30b5cf24d4d7327de944d9824c", default-features = false, features = [
    "io-pipe",
] }
gix-transport = { git = "https://github.com/moturus/gitoxide.git", rev = "d3e2dd89b0ea3f30b5cf24d4d7327de944d9824c", default-features = false, features = [
    "http-client",
] }

[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = "0.17.6"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
