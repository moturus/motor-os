version = 1
kind = "process"
name = "search_files"
description = "Search files with ripgrep JSON output and a literal regex and path. No matches is a normal result."
parameters = "parameters.json"
read_only = true

[process]
timeout_seconds = 30
max_output_bytes = 1048576
output = "stdout"
stdin = "arguments"

[process.command]
common = ["gears-batteries", "tool", "search_files"]
