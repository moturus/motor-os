version = 1
kind = "process"
name = "sh"
description = "Run a shell command. Working directory and exported variables persist within this session. The command is not sandboxed."
parameters = "parameters.json"
display = "{command}"

[motor]
description = "Run a rush command; directory and exports persist within this session. Use rg instead of grep; sysbox has head, tail, diff, find, wc, cat, less (no tail -f), and mkdir -p. Use gix instead of git; sed is on the developer image. For missing commands use sed or rg -o/-r for awk, : > FILE for touch, shell parameter expansion for basename or dirname, redirection for tee, the tool timeout for timeout, and a fixed path under /user/tmp for mktemp. Commands are not sandboxed."

[process]
timeout_seconds = 120
max_output_bytes = 1048576
output = "shell"
shell_state = true

[process.command]
linux = ["/bin/bash", "-c", "GEARS_SH_FIXED_PATH=/usr/local/bin:/usr/bin:/bin; . \"$GEARS_TOOL_DIR/run.sh\"", "gears-sh"]
motor = ["/system/bin/rush", "-c", "GEARS_SH_FIXED_PATH=/system/bin:/devtools/bin; . \"$GEARS_TOOL_DIR/run.sh\"", "gears-sh"]

[process.arguments]
before_double_dash = ["timeout", "command"]

[process.arguments.timeout]
type = "timeout_seconds"

[process.arguments.command]
type = "string"
