# The Gears settings that ship with Gears. Gears asks for everything else.
version = 1
default_provider = "openrouter"

# Gears offers these providers and models when no model is chosen yet, and in
# /setup; any other model id can be typed there. Keys are saved beside this
# file in the Gears directory. A provider without api_key_file gets no key.
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_file = "openrouter.key"
models = ["~deepseek/deepseek-v4-flash-latest", "google/gemini-3.8-flash",
          "google/gemma-4-26b-a4b-it:free", "openai/gpt-6.1-sol",
          "openai/gpt-6-astra"]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_file = "openai.key"
models = ["gpt-6.1-sol", "gpt-6-astra"]

[providers.local]
base_url = "http://127.0.0.1:8080/v1"
models = ["local"]

[net]
egress_allowlist = ["openrouter.ai", "api.openai.com", "127.0.0.1"]
plain_http_allowlist = ["127.0.0.1"]

[[tools]]
directory = "tools/sh"
enabled = false

[[tools]]
directory = "tools/ls"
enabled = false

[[tools]]
directory = "tools/rg"
enabled = false

[[tools]]
directory = "tools/head"
enabled = false

[[tools]]
directory = "tools/tail"
enabled = false

[[tools]]
directory = "tools/diff"
enabled = false

[[tools]]
directory = "tools/find"
enabled = false

[[tools]]
directory = "tools/wc"
enabled = false

[[tools]]
directory = "tools/cat"
enabled = false

[[tools]]
directory = "tools/sed"
enabled = false

[[tools]]
directory = "tools/gix"
