# The Gears settings for the batteries coding workflow, used with
# gears --config PATH/gears-batteries.toml. Gears asks for everything else.
version = 1
default_provider = "openrouter"

# Gears offers these providers and models when no model is chosen yet, and in
# /setup; any other model id can be typed there. Keys are saved beside this
# file in the Gears directory. A provider without api_key_file gets no key.
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_file = "openrouter.key"
models = ["~deepseek/deepseek-v4-flash-latest", "google/gemini-3.8-flash",
          "google/gemma-4-26b-a4b-it:free", "openai/gpt-6.1-sol",
          "openai/gpt-6-astra"]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_file = "openai.key"
models = ["gpt-6.1-sol", "gpt-6-astra"]

[providers.local]
base_url = "http://127.0.0.1:8080/v1"
models = ["local"]

[net]
egress_allowlist = ["openrouter.ai", "api.openai.com", "127.0.0.1"]
plain_http_allowlist = ["127.0.0.1"]

[[hooks]]
name = "batteries"
command = ["gears-batteries", "hook"]
events = ["initialize", "permission", "tool_execute", "tool_result",
          "turn_start", "entry", "before_stop", "turn_end", "answer",
          "command"]
timeout_seconds = 30
max_output_bytes = 1048576

[[tools]]
directory = "tools/read_file"
enabled = true

[[tools]]
directory = "tools/write_file"
enabled = true

[[tools]]
directory = "tools/patch"
enabled = true

[[tools]]
directory = "tools/search_files"
enabled = true

[[tools]]
directory = "tools/check"
enabled = true

[[tools]]
directory = "tools/session_search"
enabled = true

[[tools]]
directory = "tools/sh"
enabled = true

[[tools]]
directory = "tools/gix"
enabled = true

[[tools]]
directory = "tools/lorry"
enabled = true

[[tools]]
directory = "tools/curl"
enabled = true
