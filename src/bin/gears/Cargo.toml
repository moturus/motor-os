[package]
name = "gears"
description = "Extensible agent harness for Linux and Motor OS."
version = "0.1.0"
edition = "2024"
default-run = "gears"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = [
    "events",
    "bracketed-paste",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.8", default-features = false, features = [
    "force-soft",
    "std",
] }
toml = "0.8.10"
yaml_serde = "=0.10.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native process control and terminal-input readiness on Motor OS.
[target.'cfg(not(unix))'.dependencies]
ctrlc = { git = "https://github.com/moturus/rust-ctrlc.git", branch = "motor-os-rustc" }
moto-rt = "0.17.6"
moto-sys = "0.3.0"

# The local TLS provider mock (examples/mock-provider.rs) is test-only.
[dev-dependencies]
rustls = { version = "=0.23.42", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pemfile = "=2.2.0"

[target.'cfg(target_os = "motor")'.dev-dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }

# Motor OS ports: crossterm (shared with red, rmux and rush) and ring.
[patch.crates-io]
crossterm = { git = "https://github.com/moturus/crossterm.git", branch = "motor-os-support" }
ring = { git = "https://github.com/moturus/ring.git", branch = "motor-os-0.17.14" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
