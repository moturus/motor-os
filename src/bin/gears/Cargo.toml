[package]
name = "gears"
description = "An agentic coding harness for Motor OS."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
