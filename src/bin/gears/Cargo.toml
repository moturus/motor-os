[package]
name = "gears"
description = "An agentic coding harness for Motor OS."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = [
    "events",
    "bracketed-paste",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.8", default-features = false, features = [
    "force-soft",
    "std",
] }
toml = "0.8.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native process control and terminal-input readiness on Motor OS.
[target.'cfg(not(unix))'.dependencies]
moto-rt = { path = "../../sys/lib/moto-rt" }
moto-sys = { path = "../../sys/lib/moto-sys" }

# The shared Motor backend used by red, rmux, and rush; not a Gears fork.
[patch.crates-io]
crossterm = { git = "https://github.com/moturus/crossterm.git", branch = "motor-os-support" }
moto-rt = { path = "../../sys/lib/moto-rt" }

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
