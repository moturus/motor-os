[package]
name = "red"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# The terminal: keys, the size, raw mode, the alternate screen and the escape
# sequences the editor paints with. Its Motor OS backend is what makes a console
# with no termios, no ioctl and no signals look like a terminal.
crossterm = { version = "0.29", default-features = false, features = [
  "events",
  "bracketed-paste",
] }

# The pty that `tests/resize.rs` drives red over: on this host a resize is a
# `SIGWINCH` from one, which is the nearest thing to the report Motor OS pushes.
# Host-only, and tests-only -- Motor OS has neither ptys nor these tests.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The Motor OS backend of crossterm, as `src/sys/Cargo.toml` patches it for the
# rest of the tree.
[patch.crates-io]
crossterm = { git = "https://github.com/moturus/crossterm.git", branch = "motor-os-support" }

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1