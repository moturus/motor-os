[package]
name = "gears-batteries"
description = "Optional coding workflows for Gears on Linux and Motor OS."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gears = { path = "../gears" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.8", default-features = false, features = ["force-soft", "std"] }

toml = "0.8.10"
yaml_serde = "=0.10.7"

[patch.crates-io]
crossterm = { git = "https://github.com/moturus/crossterm.git", branch = "motor-os-support" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
