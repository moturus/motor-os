[package]
name = "curl"
description = "A small curl-compatible HTTPS client for Motor OS."
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.2.0"
edition = "2024"

[dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
rustls = { version = "=0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "=2.2.0"

[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = { path = "../../sys/lib/moto-rt" }

[patch.crates-io]
cc = { git = "https://github.com/moturus/cc-rs.git", branch = "main" }
ring = { git = "https://github.com/moturus/ring.git", branch = "motor-os-0.17.14" }

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
