[package]
name = "lorry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "=4.6.0", default-features = false, features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
flate2 = { version = "=1.1.9", default-features = false, features = [
    "rust_backend",
] }
gix = { git = "https://github.com/moturus/gitoxide.git", branch = "gix-moturus", default-features = false, features = [
    "blocking-network-client",
    "sha1",
] }
gix-features = { git = "https://github.com/moturus/gitoxide.git", branch = "gix-moturus", default-features = false, features = [
    "io-pipe",
] }
gix-transport = { git = "https://github.com/moturus/gitoxide.git", branch = "gix-moturus", default-features = false, features = [
    "http-client",
] }
semver = { version = "=1.0.26", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.150", default-features = false, features = [
    "std",
] }
sha2 = { version = "=0.10.8", default-features = false, features = [
    "force-soft",
    "std",
] }
toml_edit = { version = "=0.22.26", default-features = false, features = [
    "parse",
] }

[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = "0.17.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.186", default-features = false }

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
