[package]
name = "russhd"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger   = "=0.11.8"
hex          = "0.4.3"
log          = "=0.4.28"
moto-sdk     = "0.1"
rand         = "0.10"
russh        = { git = "https://github.com/moturus/russh.git", branch = "server-window", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp   = "=2.1.1"
serde        = { version = "1.0.*", features = ["derive"] }
sha2         = "=0.10.8"
tokio        = { version = "=1.47.1", features = ["fs", "process", "rt", "sync"] }
toml         = "0.8.10"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "motor")'.dependencies]
getrandom    = { version = "=0.2.17", features = ["custom"] }

[target.'cfg(unix)'.dev-dependencies]
tokio = { version = "=1.47.1", features = ["test-util"] }

[patch.crates-io]
mio     ={ git = "https://github.com/moturus/mio.git"  , branch = "mio-motor-v1.0.4_2025-10-07"   }
ring    = { git = "https://github.com/moturus/ring.git" , branch = "motor-os-0.17.14"              }
tokio   = { git = "https://github.com/moturus/tokio.git", branch = "tokio-motor-1.47.1_2025-10-07" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
