[package]
name = "httpd-axum"
description = "A simple HTTPd serving static content."
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[[test]]
name = "cli"
path = "tests/cli.rs"
harness = false

[[test]]
name = "fs_path"
path = "tests/fs_path.rs"
harness = false

[[test]]
name = "http"
path = "tests/http.rs"
harness = false

[[test]]
name = "cache_store"
path = "tests/cache_store.rs"
harness = false

[[test]]
name = "cache_response"
path = "tests/cache_response.rs"
harness = false

[[test]]
name = "redirect"
path = "tests/redirect.rs"
harness = false

[[test]]
name = "rejections"
path = "tests/rejections.rs"
harness = false

[[test]]
name = "cache_fill"
path = "tests/cache_fill.rs"
harness = false

[dependencies]
axum = "0.8.1"
http = "1.2"
http-body = "1"
http-body-util = "0.1"
httpdate = "1.0"
http-range-header = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.7.1", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
clap = { version = "=4.5.6", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.47.1", features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "sync", "time"] }

[target.'cfg(target_os = "motor")'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
moto-rt = "0.17.6"

[dev-dependencies]
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "time"] }

[patch.crates-io]
ring  = { git = "https://github.com/moturus/ring.git", branch = "motor-os-0.17.14" }
mio   = { git = "https://github.com/moturus/mio.git", branch = "mio-motor-v1.0.4_2025-10-07" }
tokio = { git = "https://github.com/moturus/tokio.git", branch = "tokio-motor-1.47.1_2025-10-07" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
