[workspace]
members = [
  # system libraries (legacy, to be refactored)
  "lib/memfs",
  "lib/moto-dns",
  "lib/motor-fs",
  "lib/timeq",
  "lib/virtio-async",

  # various generic tools (not Motor OS specific)
  "lib/frusa",

  # system libraries
  "lib/moto-rt",
  "lib/moto-rt-cabi",
  "lib/moto-sdk",
  "lib/moto-sys",
  "lib/rt.vdso",

  # system binaries
  "dns-resolver",
  "kernel",
  "strobe",
  "sys-init",
  "sys-io",
  "sys-io/netstack",
  "sys-tty",

  # tools
  "tools/mdbg",
  "tools/sysbox",

  # tests
  "tests/crossbench",
  "tests/crossterm-smoke",
  "tests/mio-test",
  "tests/systest",
  "tests/tokio-tests",
]
resolver = "2"

[patch.crates-io]
moto-rt      = { path = "lib/moto-rt"         }
moto-sys     = { path = "lib/moto-sys"        }

crossterm    = { git = "https://github.com/moturus/crossterm.git", branch = "motor-os-support" }
mio          = { git = "https://github.com/moturus/mio.git", branch = "mio-motor-v1.0.4_2025-10-07" }
parking_lot  = { git = "https://github.com/moturus/parking_lot.git", rev = "bae5531d97330ee51ce59e4cb4322f5d4e426305" }
parking_lot_core = { git = "https://github.com/moturus/parking_lot.git", rev = "bae5531d97330ee51ce59e4cb4322f5d4e426305" }
tokio        = { git = "https://github.com/moturus/tokio.git", branch = "tokio-motor-1.47.1_2025-10-07" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
