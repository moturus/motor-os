[package]
name = "systest"
description = "Motor OS systest."
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
virtio-task-tests = { path = "../virtio-task-tests" }
virtio-async = { path = "../../lib/virtio-async", features = ["test-support"] }
moto-rt      = { path = "../../lib/moto-rt", features = ["libc"] }
moto-sdk     = { path = "../../lib/moto-sdk"    , features = ["test-support"] }
moto-sys     = { path = "../../lib/moto-sys"    }

crossbeam = "0.8.4"
futures = "0.3"
log = "0.4.28"
