[package]
name = "rt"
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "rt"
path = "src/main.rs"

[lib]
# The following magic line makes rust analyzer stop
# complaining about the panic handler in src/main.rs.
test = false

[dependencies]

# internal dependencies
frusa            = { path = "../frusa"            }
futures          = { version = "0.3", default-features = false, features = ["alloc"] }
moto-dns         = { path = "../moto-dns"         }
moto-rt          = { path = "../moto-rt"          , features = ["libc"]       }
moto-sdk         = { path = "../moto-sdk"         , default-features = false  }
moto-sys         = { path = "../moto-sys"         }

# external dependencies
log = "0.4.28"

[lints.rust]
unexpected_cfgs = { level = 'allow', check-cfg = [ 'cfg(test)'] }
