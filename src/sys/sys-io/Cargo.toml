[package]
name = "sys-io"
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal.
async-fs         = { path = "../lib/async-fs"         }
moto-async       = { path = "../lib/moto-async"       }
moto-io-internal = { path = "../lib/moto-io-internal" }
moto-ipc         = { path = "../lib/moto-ipc"         }
moto-rt          = { path = "../lib/moto-rt"          }
moto-stats       = { path = "../lib/moto-stats"       }
moto-sys         = { path = "../lib/moto-sys"         }
moto-sys-io      = { path = "../lib/moto-sys-io", features = ["std"] }
moto-tooling     = { path = "../lib/moto-tooling"     }
motor-fs         = { path = "../lib/motor-fs"         }
timeq            = { path = "../lib/timeq"            }
virtio-async     = { path = "../lib/virtio-async"     }

# External.
async-trait  = "0.1.88"
crossbeam    = "0.8.4"
elfloader    = { path = "../../third_party/elfloader" }
futures      = "0.3"
ipnetwork    = "0.20.0"
log          = "0.4.28"
moto-netstack = { path = "netstack", default-features = false, features = [
  "async",
  "medium-ethernet",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "socket-icmp",
  "socket-tcp",
  # Selecting neither controller leaves TCP with no congestion control at all.
  # Cubic is what a general-purpose host is expected to run, and its `f64` is
  # unremarkable here: Motor enables SSE/AVX at boot and the kernel xsaves across
  # context switches. The gap this comment used to record -- a window that grew
  # only from a 100ms timer, thousands of RTTs on a sub-millisecond link -- was
  # closed with the controller itself; `pre_transmit` runs the curve in
  # microseconds now.
  "socket-tcp-cubic",
  # Out-of-order capacity: 32 holes rather than the default 4. Past capacity a
  # segment is dropped *and not acknowledged* (`socket/tcp.rs`, the
  # `add_then_remove_front` failure), which stops the duplicate ACKs a fast
  # retransmit is built from and hands recovery to the RTO. Four holes against a
  # 128 KiB receive window -- about ninety segments -- is reachable at a few
  # percent loss. The cost is 16 bytes per hole per socket, so 512 against the
  # 256 KiB of buffers the same socket already holds.
  #
  # The crate's own tests do not read this: `lib.rs` gives `cfg(test)` a
  # hardcoded config. Keeping the two equal is manual, and the `const` assertion
  # in `runtime/net/socket/tcp.rs` is what makes a drift a build failure.
  "assembler-max-segment-count-32",
  # Addresses and routes per interface have no cap feature any more: the
  # tables grow to whatever /sys/cfg/sys-net.toml writes, bounded by the
  # config loader's 64 KiB file limit.
  # Neighbours: 64 rather than 8. The cache is a `LinearMap`, so a lookup scans
  # what is *occupied* and not what is reserved -- a quiet VM with two
  # neighbours scans two entries either way, and capacity costs only the 16
  # bytes per entry it reserves. 64 rather than the 1024 on offer because
  # `fill_unsolicited` lets any peer on the segment take a *free* slot (it may
  # never evict one), so occupancy, and with it the scan, is the one thing a
  # peer spoofing source addresses can inflate.
  "iface-neighbor-cache-count-64",
  "socket-udp",
] }
rand         = { version = "0.9.0", features = ["small_rng"], default-features = false }
serde        = { version = "1.0.*", features = ["derive"] }
toml         = "0.9.0"
zerocopy     = { version = "0.8", features = ["std", "derive"] }
