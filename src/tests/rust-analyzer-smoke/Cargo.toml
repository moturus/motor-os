[package]
name = "rust-analyzer-smoke"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "rust-analyzer-smoke"

[[bin]]
name = "rust-analyzer-resource-sampler"
path = "src/resource_sampler.rs"

[dependencies]
serde_json = "=1.0.150"

[target.'cfg(target_os = "motor")'.dependencies]
moto-sys = { path = "../../sys/lib/moto-sys" }
moto-stats = { path = "../../sys/lib/moto-stats" }
