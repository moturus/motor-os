[package]
name = "imager"
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[dependencies]
async-fs = { path = "../sys/lib/async-fs" }
fittings = { path = "../sys/lib/fittings" }
motor-fs = { path = "../sys/lib/motor-fs", features = ["image-admin"] }

async-trait = "0.1.88"
env_logger = "0.11"
camino     = "1.1.10"
mbrman     = "0.5.2"
serde      = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sha2       = "=0.10.8"
# Pinned to the version russhd uses to load host_key.
ssh-key    = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
tokio      = { version = "1.44.2", default-features = false, features = ["rt"] }
