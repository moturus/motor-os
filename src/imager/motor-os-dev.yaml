  - "/user/bin/wg-tool"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/user/bin/rush"
  - "/system/bin/rush"
  - "/user/bin/sysbox"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/user/bin/curl"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/user/bin/ssh"
  - "/user/bin/dev/gix"
  - "/user/bin/dev/lorry"
  - "/user/bin/dev/mdbg"
  - "/user/lib/imager/imager"
  - "/devtools/tests/crossbench"
  - "/devtools/tests/crossterm-smoke"
  - "/devtools/tests/mio-test"
  - "/devtools/tests/rmux-probe"
  - "/devtools/tests/rnetbench"
  - "/devtools/tests/systest"
  - "/devtools/tests/wg-self-test"
  - "/devtools/tests/tokio-tests"
directories:
  - "/system"
  - "/system/bin"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/bin/dev"
  - "/user/lib"
  - "/user/lib/imager"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/none"
  - "/none/cfg"
  - "/none/tmp"
  - "/devtools"
  - "/devtools/bin"
  - "/user/lib/javy"
  - "/user/lib/javy/plugins"
  - "/devtools/llvm"
  - "/devtools/llvm/bin"
  - "/devtools/llvm/cfg"
  - "/devtools/llvm/include"
  - "/devtools/llvm/lib"
  - "/user/dev"
  - "/none/dev/lorry"
  - "/none/dev/lorry/cache"
  - "/none/dev/lorry/vendor"
  - "/none/dev/lorry/vendor/objects"
  - "/none/dev/lorry/vendor/objects/crates-io"
  - "/none/dev/lorry/vendor/objects/crates-io/sha256"
  - "/none/dev/lorry/vendor/.staging"
  - "/user/dev/lorry"
  - "/user/dev/lorry/cache"
  - "/user/dev/lorry/vendor"
  - "/user/dev/lorry/vendor/objects"
  - "/user/dev/lorry/vendor/objects/crates-io"
  - "/user/dev/lorry/vendor/objects/crates-io/sha256"
  - "/user/dev/lorry/vendor/.staging"
  - "/devtools/rust"
  - "/devtools/rust/bin"
  - "/devtools/rust/lib"
  - "/none/dev"
  - "/devtools/tests"
  - "/user/lib/wasmtime"
  - "/user/lib/www"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
  - "img_files/motor-os-dev"
assembly_dirs:
  - "libc"
  - "rg"
  - "tar"
  - "llvm"
  - "rustc"
  - "helix"
  - "lua"
  - "quickjs"
  - "sed"
  - "rust-analyzer"
  - "javy"
  - "wasmtime"
  - "sys-lib-deps"
assembly_required_executables:
  - "quickjs/user/bin/dev/qjs"
  - "quickjs/user/bin/dev/qjsc"
  - "rg/user/bin/rg"
  - "tar/user/bin/tar"
  - "tar/user/bin/zstd"
  - "llvm/devtools/bin/cc"
  - "llvm/devtools/bin/c++"
  - "llvm/devtools/llvm/bin/llvm"
  - "rustc/devtools/bin/rustc"
  - "rustc/devtools/rust/bin/rustc"
  - "rustc/devtools/bin/rustfmt"
  - "rustc/devtools/rust/bin/rustfmt"
  - "rustc/devtools/bin/clippy-driver"
  - "rustc/devtools/rust/bin/clippy-driver"
  - "helix/user/lib/helix/hx"
  - "sed/user/bin/dev/sed"
  - "rust-analyzer/devtools/rust/bin/rust-analyzer"
  - "javy/user/bin/dev/javy"
  - "javy/user/bin/dev/wasmi"
  - "wasmtime/user/bin/dev/wasmtime"
  - "wasmtime/user/bin/dev/wasmtime-rt"
source_dirs:
  - source: "src/bin/red"
    destination: "/none/dev/motor-os/bin/red"
  - source: "src/bin/lorry"
    destination: "/none/dev/motor-os/bin/lorry"
  - source: "src/sys/lib/moto-rt"
    destination: "/none/dev/motor-os/sys/lib/moto-rt"
  - source: "src/sys/lib/moto-sys"
    destination: "/none/dev/motor-os/sys/lib/moto-sys"
  - source: "src/sys/lib/moto-sdk"
    destination: "/none/dev/motor-os/sys/lib/moto-sdk"
ca_bundle: "/etc/ssl/certs/ca-certificates.crt"
filesystem: "motor-fs"
img_name: "motor-os-dev.qcow2"
image_format: "qcow2"
data_partition_size_mb: 16384
