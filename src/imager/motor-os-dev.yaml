permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/system/bin/rush"
  - "/system/bin/sysbox"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/system/bin/curl"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/devtools/bin/gears"
  - "/devtools/bin/lorry"
  - "/devtools/bin/mdbg"
  - "/devtools/tests/gears/gears-mock-provider"
  - "/devtools/tests/gears/gears-crossterm-frame"
  - "/devtools/tests/crossbench"
  - "/devtools/tests/crossterm-smoke"
  - "/devtools/tests/mio-test"
  - "/devtools/tests/rnetbench"
  - "/devtools/tests/systest"
  - "/devtools/tests/tokio-tests"
directories:
  - "/system"
  - "/system/bin"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/lorry"
  - "/user/cfg/lorry/vendor"
  - "/user/cfg/lorry/vendor/objects"
  - "/user/cfg/lorry/vendor/objects/crates-io"
  - "/user/cfg/lorry/vendor/objects/crates-io/sha256"
  - "/user/cfg/lorry/vendor/objects/seeded-git"
  - "/user/cfg/lorry/vendor/objects/seeded-git/sha256"
  - "/user/cfg/lorry/vendor/.staging"
  - "/user/tmp"
  - "/devtools"
  - "/devtools/bin"
  - "/devtools/cfg"
  - "/devtools/cfg/llvm"
  - "/devtools/llvm"
  - "/devtools/llvm/bin"
  - "/devtools/llvm/include"
  - "/devtools/llvm/lib"
  - "/devtools/lorry"
  - "/devtools/rust"
  - "/devtools/rust/bin"
  - "/devtools/rust/lib"
  - "/devtools/src"
  - "/devtools/tests"
  - "/devtools/tests/gears"
  - "/devtools/tmp"
  - "/devtools/www"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
  - "img_files/generated/libc"
  - "img_files/generated/rg"
  - "img_files/motor-os-dev"
  - "img_files/generated/llvm"
  - "img_files/generated/rustc"
required_executables:
  - "img_files/generated/rg/system/bin/rg"
  - "img_files/generated/llvm/devtools/bin/cc"
  - "img_files/generated/llvm/devtools/bin/c++"
  - "img_files/generated/llvm/devtools/llvm/bin/llvm"
  - "img_files/generated/rustc/devtools/bin/rustc"
  - "img_files/generated/rustc/devtools/rust/bin/rustc"
source_dirs:
  - source: "src/bin/red"
    destination: "/devtools/src/src/bin/red"
  - source: "src/bin/lorry"
    destination: "/devtools/src/src/bin/lorry"
  - source: "src/bin/gears"
    destination: "/devtools/src/src/bin/gears"
  - source: "src/sys/lib/moto-rt"
    destination: "/devtools/src/src/sys/lib/moto-rt"
  - source: "src/sys/lib/moto-sys"
    destination: "/devtools/src/src/sys/lib/moto-sys"
filesystem: "motor-fs"
img_name: "motor-os-dev.qcow2"
image_format: "qcow2"
data_partition_size_mb: 4096
