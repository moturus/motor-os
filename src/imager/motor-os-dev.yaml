permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/system/bin/wg"
  - "/system/bin/wg-tool"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/system/bin/rush"
  - "/system/bin/sysbox"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/system/bin/curl"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/user/bin/ssh"
  - "/devtools/bin/gears"
  - "/devtools/bin/gears-batteries"
  - "/devtools/bin/gix"
  - "/devtools/bin/lorry"
  - "/devtools/bin/mdbg"
  - "/devtools/tests/crossbench"
  - "/devtools/tests/crossterm-smoke"
  - "/devtools/tests/mio-test"
  - "/devtools/tests/rmux-probe"
  - "/devtools/tests/rnetbench"
  - "/devtools/tests/systest"
  - "/devtools/tests/wg-self-test"
  - "/devtools/tests/tokio-tests"
directories:
  - "/system"
  - "/system/bin"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/none"
  - "/none/cfg"
  - "/none/tmp"
  - "/devtools"
  - "/devtools/bin"
  - "/devtools/javy"
  - "/devtools/javy/plugins"
  - "/devtools/llvm"
  - "/devtools/llvm/bin"
  - "/devtools/llvm/cfg"
  - "/devtools/llvm/include"
  - "/devtools/llvm/lib"
  - "/devtools/lorry"
  - "/devtools/lorry/none"
  - "/devtools/lorry/none/cache"
  - "/devtools/lorry/none/vendor"
  - "/devtools/lorry/none/vendor/objects"
  - "/devtools/lorry/none/vendor/objects/crates-io"
  - "/devtools/lorry/none/vendor/objects/crates-io/sha256"
  - "/devtools/lorry/none/vendor/.staging"
  - "/devtools/lorry/user"
  - "/devtools/lorry/user/cache"
  - "/devtools/lorry/user/vendor"
  - "/devtools/lorry/user/vendor/objects"
  - "/devtools/lorry/user/vendor/objects/crates-io"
  - "/devtools/lorry/user/vendor/objects/crates-io/sha256"
  - "/devtools/lorry/user/vendor/.staging"
  - "/devtools/rust"
  - "/devtools/rust/bin"
  - "/devtools/rust/lib"
  - "/devtools/src"
  - "/devtools/tests"
  - "/devtools/wasmtime"
  - "/devtools/www"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
  - "img_files/motor-os-dev"
assembly_dirs:
  - "libc"
  - "rg"
  - "tar"
  - "llvm"
  - "rustc"
  - "helix"
  - "lua"
  - "sed"
  - "rust-analyzer"
  - "javy"
  - "wasmtime"
  - "sys-lib-deps"
assembly_required_executables:
  - "rg/system/bin/rg"
  - "tar/system/bin/tar"
  - "tar/system/bin/zstd"
  - "llvm/devtools/bin/cc"
  - "llvm/devtools/bin/c++"
  - "llvm/devtools/llvm/bin/llvm"
  - "rustc/devtools/bin/rustc"
  - "rustc/devtools/rust/bin/rustc"
  - "rustc/devtools/bin/rustfmt"
  - "rustc/devtools/rust/bin/rustfmt"
  - "rustc/devtools/bin/clippy-driver"
  - "rustc/devtools/rust/bin/clippy-driver"
  - "helix/devtools/helix/hx"
  - "sed/devtools/bin/sed"
  - "rust-analyzer/devtools/rust/bin/rust-analyzer"
  - "javy/devtools/bin/javy"
  - "javy/devtools/bin/wasmi"
  - "wasmtime/devtools/bin/wasmtime"
  - "wasmtime/devtools/bin/wasmtime-rt"
source_dirs:
  - source: "src/bin/red"
    destination: "/devtools/src/motor-os/bin/red"
  - source: "src/bin/lorry"
    destination: "/devtools/src/motor-os/bin/lorry"
  - source: "src/bin/gears"
    destination: "/devtools/src/motor-os/bin/gears"
  - source: "src/bin/gears/tools"
    destination: "/user/cfg/gears/tools"
  - source: "src/bin/gears/config"
    destination: "/user/cfg/gears"
  - source: "src/sys/lib/moto-rt"
    destination: "/devtools/src/motor-os/sys/lib/moto-rt"
  - source: "src/sys/lib/moto-sys"
    destination: "/devtools/src/motor-os/sys/lib/moto-sys"
  - source: "src/sys/lib/moto-sdk"
    destination: "/devtools/src/motor-os/sys/lib/moto-sdk"
ca_bundle: "/etc/ssl/certs/ca-certificates.crt"
filesystem: "motor-fs"
img_name: "motor-os-dev.qcow2"
image_format: "qcow2"
data_partition_size_mb: 16384
