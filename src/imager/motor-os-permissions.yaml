default:
  directory: "rwxr-xr-x"
  file: "rw-r--r--"
  script: "rwxr-xr-x"
  elf: "r-xr-xr-x"

trees:
  - path: "/system/bin"
    directory: "rwxr-xr-x"
    file: "rw-r--r--"
    script: "r-xr-xr-x"
    elf: "r-xr-xr-x"
  - path: "/system/logs"
    directory: "rwxr-x---"
    file: "rw-r-----"
    script: "r-xr-----"
    elf: "r-xr-----"
  - path: "/system/tmp"
    directory: "rwxrwxrwx"
    file: "rw-rw-rw-"
    script: "rwxrwxrwx"
    elf: "r-xr-xr-x"
  - path: "/user"
    directory: "rwxrwxr-x"
    file: "rw-rw-r--"
    script: "rwxrwxr-x"
    elf: "r-xr-xr-x"
  - path: "/user/bin"
    directory: "rwxrwxr-x"
    file: "rw-rw-r--"
    script: "rwxrwxr-x"
    elf: "r-xr-xr-x"
  - path: "/user/cfg"
    directory: "rwxrwx---"
    file: "rw-rw----"
    script: "rwxrwx---"
    elf: "r-xr-x---"
  - path: "/user/tmp"
    directory: "rwxrwxrwx"
    file: "rw-rw-rw-"
    script: "rwxrwxrwx"
    elf: "r-xr-xr-x"
  - path: "/devtools/bin"
    directory: "rwxr-xr-x"
    file: "rw-r--r--"
    script: "rwxrwxr-x"
    elf: "r-xr-xr-x"
  - path: "/devtools/lorry"
    directory: "rwxrwx---"
    file: "rw-rw----"
    script: "rwxrwx---"
    elf: "r-xr-x---"
  - path: "/devtools/src"
    directory: "rwxrwxr-x"
    file: "rw-rw-r--"
    script: "rwxrwxr-x"
    elf: "r-xr-xr-x"
  - path: "/devtools/tmp"
    directory: "rwxrwxrwx"
    file: "rw-rw-rw-"
    script: "rwxrwxrwx"
    elf: "r-xr-xr-x"

entries:
  - path: "/system/cfg/sshd.toml"
    mode: "rw-r-----"
  - path: "/system/cfg/ssl/ssl-key.pem"
    mode: "rw-r-----"
