permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/system/bin/rush"
  - "/system/bin/sysbox"
  - "/user/bin/systest"
directories:
  - "/system"
  - "/system/bin"
  - "/system/cfg"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/none"
  - "/none/cfg"
  - "/none/tmp"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/test-system-tty"
  - "img_files/test-ro-root"
ca_bundle: "/etc/ssl/certs/ca-certificates.crt"
filesystem: "motor-fs"
img_name: "motor-os-ro-root.img"
image_format: "raw"
data_partition_size_mb: 128
