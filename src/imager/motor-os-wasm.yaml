permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/system/bin/rush"
  - "/system/bin/sysbox"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/user/bin/ssh"
directories:
  - "/system"
  - "/system/bin"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/devtools"
  - "/devtools/bin"
  - "/devtools/cfg"
  - "/devtools/cfg/javy"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
assembly_dirs:
  - "libc"
  - "rg"
  - "javy"
assembly_required_executables:
  - "rg/system/bin/rg"
  - "javy/devtools/bin/javy"
  - "javy/devtools/bin/wasmi"
filesystem: "motor-fs"
img_name: "motor-os-wasm.qcow2"
image_format: "qcow2"
data_partition_size_mb: 1024
