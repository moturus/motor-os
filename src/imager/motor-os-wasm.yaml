permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/user/bin/wg"
  - "/user/bin/wg-tool"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/user/bin/rush"
  - "/user/bin/sysbox"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/user/bin/ssh"
directories:
  - "/system"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/none"
  - "/none/cfg"
  - "/none/dev"
  - "/none/tmp"
  - "/user/bin/dev"
  - "/user/lib/javy"
  - "/user/lib/javy/plugins"
  - "/user/lib/wasmtime"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
assembly_dirs:
  - "libc"
  - "rg"
  - "javy"
  - "wasmtime"
assembly_required_executables:
  - "rg/user/bin/rg"
  - "javy/user/bin/dev/javy"
  - "javy/user/bin/dev/wasmi"
  - "wasmtime/user/bin/dev/wasmtime"
  - "wasmtime/user/bin/dev/wasmtime-rt"
ca_bundle: "/etc/ssl/certs/ca-certificates.crt"
filesystem: "motor-fs"
img_name: "motor-os-wasm.qcow2"
image_format: "qcow2"
data_partition_size_mb: 1024
