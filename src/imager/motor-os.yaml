permission_policy: "motor-os-permissions.yaml"
input_files:
  - "/system/services/russhd"
  - "/user/bin/wg"
  - "/user/bin/wg-tool"
  - "/system/services/strobe"
  - "/system/services/sys-init"
  - "/system/services/sys-tty"
  - "/user/bin/rush"
  - "/user/bin/sysbox"
  - "/user/bin/curl"
  - "/user/bin/red"
  - "/user/bin/rmux"
  - "/system/services/dns-resolver"
  - "/user/bin/httpd"
  - "/user/bin/httpd-axum"
  - "/user/bin/kibim"
  - "/user/bin/ssh"
directories:
  - "/system"
  - "/system/cfg"
  - "/system/cfg/libc"
  - "/system/logs"
  - "/system/services"
  - "/system/tmp"
  - "/user"
  - "/user/bin"
  - "/user/cfg"
  - "/user/cfg/kibim"
  - "/user/cfg/ssh"
  - "/user/tmp"
  - "/none"
  - "/none/cfg"
  - "/none/dev"
  - "/none/tmp"
static_dirs:
  - "img_files/motor-os-base"
  - "img_files/motor-os"
assembly_dirs:
  - "libc"
  - "rg"
  - "tar"
assembly_required_executables:
  - "rg/user/bin/rg"
  - "tar/user/bin/tar"
  - "tar/user/bin/zstd"
ca_bundle: "/etc/ssl/certs/ca-certificates.crt"
filesystem: "motor-fs"
img_name: "motor-os.qcow2"
image_format: "qcow2"
data_partition_size_mb: 32768
raw_data_partition_size_mb: 256
